name: Build Android APK

# Construit l'APK Easy Dunya (Capacitor + FCM) dans le cloud.
# Lancement manuel : onglet Actions → "Build Android APK" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: "URL du site (défaut Netlify). Mettre « embedded » pour dist embarqué + secrets GitHub VITE_*"
        required: false
        default: "https://easydunya.netlify.app"
      ref:
        description: "Branche ou tag Git à builder (ex. preview/local-updates)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vérifier les secrets Android (keystore + FCM)
        run: |
          missing=0
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::Secret manquant : GOOGLE_SERVICES_JSON (google-services.json Firebase)"
            missing=1
          fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret manquant : KEYSTORE_BASE64"
            missing=1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret manquant : KEYSTORE_PASSWORD"
            missing=1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Secret manquant : KEY_ALIAS"
            missing=1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret manquant : KEY_PASSWORD"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          REMOTE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.capacitor_server_url || 'https://easydunya.netlify.app' }}"
          if [ "$REMOTE" = "embedded" ] || [ "$REMOTE" = "local" ]; then
            if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] || [ -z "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" ]; then
              echo "::error::Mode embedded : ajoutez VITE_SUPABASE_ANON_KEY et VITE_GOOGLE_MAPS_API_KEY dans GitHub Secrets"
              exit 1
            fi
          else
            echo "Mode Netlify ($REMOTE) — clés VITE_* lues sur Netlify, pas GitHub ✓"
          fi
          echo "Secrets Android OK ✓"

      - name: Build web (dist)
        run: npm run build
        env:
          BUILD_FOR_APK: "1"
          VITE_SUPABASE_URL: https://prfmqfnaqtmyfyxqjeli.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_DEFAULT_LOCALE: fr

      - name: Generate Android launcher icons
        run: npm run native-icons

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Écrire google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json'))"
          echo "google-services.json valide ✓"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Capacitor sync
        run: |
          REMOTE_URL="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.capacitor_server_url || 'https://easydunya.netlify.app' }}"
          export CAPACITOR_SERVER_URL="$REMOTE_URL"
          npx cap sync android
          echo "Capacitor → ${REMOTE_URL:-embedded}"
          test -f android/app/src/main/assets/public/index.html

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Décoder le keystore
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          echo "Keystore décodé ($(wc -c < android/app/release.keystore) octets) ✓"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyDunya-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

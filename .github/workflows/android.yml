name: Build Android APK

# Construit l'APK Easy Dunya (Capacitor + FCM) dans le cloud.
# Lancement manuel : onglet Actions → "Build Android APK" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: "URL distante (laisser vide = dist embarqué dans l'APK, recommandé)"
        required: false
        default: ""
      ref:
        description: "Branche ou tag Git à builder (ex. preview/local-updates)"
        required: false
        default: "main"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vérifier les secrets requis (avant build)
        run: |
          missing=0
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Secret manquant : VITE_SUPABASE_ANON_KEY"
            echo "→ Supabase Dashboard → Settings → API → anon public"
            echo "→ GitHub → Settings → Secrets and variables → Actions"
            missing=1
          fi
          if [ -z "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" ]; then
            echo "::error::Secret manquant : VITE_GOOGLE_MAPS_API_KEY (referrers + https://localhost/*)"
            missing=1
          fi
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::Secret manquant : GOOGLE_SERVICES_JSON (google-services.json Firebase)"
            missing=1
          fi
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret manquant : KEYSTORE_BASE64"
            missing=1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret manquant : KEYSTORE_PASSWORD"
            missing=1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Secret manquant : KEY_ALIAS"
            missing=1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret manquant : KEY_PASSWORD"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "Secrets requis présents ✓"

      - name: Build web (dist)
        run: npm run build
        env:
          BUILD_FOR_APK: "1"
          VITE_SUPABASE_URL: https://prfmqfnaqtmyfyxqjeli.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_DEFAULT_LOCALE: fr

      - name: Generate Android launcher icons
        run: npm run native-icons

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Écrire google-services.json
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json'))"
          echo "google-services.json valide ✓"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Capacitor sync
        run: |
          REMOTE_URL="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.capacitor_server_url || '' }}"
          export CAPACITOR_SERVER_URL="$REMOTE_URL"
          npx cap sync android
          if [ -z "$REMOTE_URL" ]; then
            node -e "
              const fs = require('fs');
              const p = 'android/app/src/main/assets/capacitor.config.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.server && c.server.url) {
                console.error('::error::server.url ne doit pas être défini pour un APK embarqué');
                process.exit(1);
              }
              if (!c.server) c.server = { androidScheme: 'https' };
              fs.writeFileSync(p, JSON.stringify(c, null, '\t'));
            "
          fi
          test -f android/app/src/main/assets/public/index.html
          echo "Web assets embarqués ✓ ($(find android/app/src/main/assets/public -type f | wc -l) fichiers)"

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Décoder le keystore
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          echo "Keystore décodé ($(wc -c < android/app/release.keystore) octets) ✓"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyDunya-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
